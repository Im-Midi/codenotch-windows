name: Windows installer

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packaging tools
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed.' }
          npm install --global @tauri-apps/cli@2.11.4
          if ($LASTEXITCODE -ne 0) { throw 'Tauri CLI installation failed.' }
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content codenotch/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match the app version.' }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          $app = $metadata.packages | Where-Object name -eq codenotch
          if ($app.version -ne $version) { throw 'Cargo and Tauri app versions must match.' }
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Test Rust workspace
        shell: pwsh
        run: cargo test --locked --workspace
      - name: Smoke test installed lifecycle
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe
          if (@($installer).Count -ne 1) { throw 'Expected one x64 installer.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.DirectoryName)/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'Im-Midi/codenotch-windows'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-installer
          path: installer
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" installer/* --verify-tag --draft \
            --title "Codenotch $RELEASE_TAG" \
            --notes "Windows x64 installer. Download the setup executable and run it. WebView2 is installed if missing (internet required). This build is unsigned; Windows may display a publisher warning."
